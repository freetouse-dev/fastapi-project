[project]
name = "project-management-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ajayraj", email = "ajayraj.b@mitrahsoft.in" }
]
requires-python = ">=3.13.15"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "pwdlib[bcrypt]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pymysql>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
project-management-api = "project_management_api:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
